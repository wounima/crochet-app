<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>祖母格鉤針設計器</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292622;background:#f7f3ee}
*{box-sizing:border-box} body{margin:0;padding:16px;background:#f7f3ee}
main{max-width:720px;margin:auto}.toolbar,.panel,.saved{background:#fff;border:1px solid #ded8d1;border-radius:16px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input{font:inherit;min-height:44px;border-radius:12px;border:1px solid #cfc7bf;background:#fff;padding:8px 12px}
button.active,.primary{background:#775b4b;color:#fff;border-color:#775b4b}button{touch-action:manipulation}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.swatch{width:44px;height:44px;border-radius:50%;padding:0}
.board{background:#fff;border-radius:16px;padding:10px;margin-bottom:12px;overflow:auto}.board svg{display:block;width:100%;min-width:286px;touch-action:none}
.hint,.status{font-size:14px;color:#716b65;text-align:center;margin:8px 0 0}
#doubleTools{display:none}.grow{flex:1;min-width:150px}.saved .row{justify-content:space-between}.center{text-align:center}.danger{color:#a33131}
</style>
</head>
<body><main>
<div class="toolbar"><div class="row">
<button id="cellMode" class="active">填格子</button><button id="lineMode">單格線</button><button id="doubleMode">雙格線</button><button id="undo">↶ 復原</button><button id="clear">清空</button>
</div></div>
<div id="doubleTools" class="panel"><b>雙格線編輯</b><div class="row" style="margin-top:8px">
<button id="lineA" class="active">線 A</button><button id="lineB">線 B</button>
</div><div class="hint">選 A 或 B，再點某段格線，可分別設定兩條線的顏色。</div></div>
<div class="panel"><div class="row" style="justify-content:space-between"><b id="modeLabel">格子顏色</b><label>自訂 <input id="picker" type="color" value="#e76f51"></label></div><div id="palette" class="palette"></div></div>
<div class="panel"><div class="row"><label>橫向格數 <input id="cols" type="number" min="2" max="50" value="11" style="width:80px"></label><label>直向格數 <input id="rows" type="number" min="2" max="50" value="11" style="width:80px"></label><button id="applySize">建立格子</button></div><div class="hint">建立新尺寸時：四個角落預設灰色，其餘格子每隔一格交錯填入目前選擇的顏色。</div></div>
<div class="board"><svg id="board" viewBox="-10 -10 570 570" aria-label="祖母格"></svg><div id="hint" class="hint">點格子上色</div></div>
<div class="panel"><div class="row"><input id="name" class="grow" value="我的祖母格" aria-label="作品名稱"><button id="save" class="primary">儲存設計</button></div></div>
<div class="saved"><div class="row"><button id="prev">←</button><div class="center"><b id="savedTitle">尚未儲存作品</b><div id="counter" class="hint">0 / 0</div></div><button id="next">→</button></div>
<div class="row" style="justify-content:center;margin-top:10px"><button id="newDesign">＋ 新作品</button><button id="load">載入</button><button id="deleteDesign" class="danger">刪除</button></div></div>
<div class="panel"><b>作品備份</b><div class="row" style="margin-top:8px;justify-content:center"><button id="backupAll">📤 備份全部作品</button><button id="restoreAll">📥 還原備份</button><input id="restoreFile" type="file" accept="application/json,.json" style="display:none"></div><div class="hint">建議每次更新 App 前先備份一次；備份檔可存到「檔案」或 iCloud Drive。</div></div>
<div id="status" class="status"></div>
</main>
<script>
(()=>{let R=11,C=11;const S=50,NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),svg=$('#board');
const colors=['#ffffff','#111827','#e76f51','#f4a261','#e9c46a','#84a98c','#2a9d8f','#4f86c6','#7b6fd0','#d16ba5','#9ca3af'];
let mode='cell',sub='A',color='#e76f51',cells=[],history=[],browse=-1,editing=-1;
const mkLines=(n)=>Array.from({length:n},()=>({double:false,a:'#9ca3af',b:'#9ca3af'}));
let v=[],h=[];
let saved=JSON.parse(localStorage.getItem('crochetSaved')||'[]');
function blank(pattern=true){cells=Array(R*C).fill('#ffffff');v=mkLines((C+1)*R);h=mkLines((R+1)*C);if(pattern){for(let r=0;r<R;r++)for(let c=0;c<C;c++)if((r+c)%2===0)cells[r*C+c]='#9ca3af'}}
function clone(){return {rows:R,cols:C,cells:[...cells],v:v.map(x=>({...x})),h:h.map(x=>({...x}))}}
const push=()=>{history.push(clone());if(history.length>50)history.shift()};
const persist=()=>localStorage.setItem('crochetSaved',JSON.stringify(saved));
function E(tag,a){const e=document.createElementNS(NS,tag);for(const[k,z]of Object.entries(a))e.setAttribute(k,z);return e}
function seg(x1,y1,x2,y2,o,kind,i){const vert=x1===x2,off=4;if(o.double){svg.append(E('line',{x1:vert?x1-off:x1,y1:vert?y1:y1-off,x2:vert?x2-off:x2,y2:vert?y2:y2-off,stroke:o.a,'stroke-width':4,'stroke-linecap':'round','pointer-events':'none'}),E('line',{x1:vert?x1+off:x1,y1:vert?y1:y1+off,x2:vert?x2+off:x2,y2:vert?y2:y2+off,stroke:o.b,'stroke-width':4,'stroke-linecap':'round','pointer-events':'none'}))}else svg.append(E('line',{x1,y1,x2,y2,stroke:o.a,'stroke-width':5,'stroke-linecap':'round','pointer-events':'none'}));if(mode!=='cell'){let hit=E('line',{x1,y1,x2,y2,stroke:'transparent','stroke-width':24,'pointer-events':'stroke'});hit.dataset[kind]=i;svg.append(hit)}}
function draw(){svg.setAttribute('viewBox',`-10 -10 ${C*S+20} ${R*S+20}`);svg.setAttribute('aria-label',`${R}乘${C}祖母格`);svg.replaceChildren();for(let r=0;r<R;r++)for(let c=0;c<C;c++){let q=E('rect',{x:c*S,y:r*S,width:S,height:S,fill:cells[r*C+c]||'#ffffff'});if(mode==='cell')q.dataset.cell=r*C+c;svg.append(q)}for(let c=0;c<=C;c++)for(let r=0;r<R;r++)seg(c*S,r*S,c*S,(r+1)*S,v[c*R+r],'v',c*R+r);for(let r=0;r<=R;r++)for(let c=0;c<C;c++)seg(c*S,r*S,(c+1)*S,r*S,h[r*C+c],'h',r*C+c)}
function restore(x){R=+(x.rows||11);C=+(x.cols||11);cells=[...x.cells];v=x.v.map(q=>({...q}));h=x.h.map(q=>({...q}));$('#rows').value=R;$('#cols').value=C;draw()}
svg.addEventListener('pointerdown',e=>{const t=e.target;if(mode==='cell'&&t.dataset.cell!==undefined){push();cells[+t.dataset.cell]=color;draw();return}let arr,idx;if(t.dataset.v!==undefined){arr=v;idx=+t.dataset.v}else if(t.dataset.h!==undefined){arr=h;idx=+t.dataset.h}else return;push();let q=arr[idx];if(mode==='line'){q.double=false;q.a=color}else{q.double=true;q[sub.toLowerCase()]=color}draw()});
colors.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.setAttribute('aria-label','顏色 '+c);b.onclick=()=>{color=c;$('#picker').value=c};$('#palette').append(b)});$('#picker').oninput=e=>color=e.target.value;
function setMode(m){mode=m;$('#doubleTools').style.display=m==='double'?'block':'none';$('#modeLabel').textContent=m==='cell'?'格子顏色':m==='line'?'單格線顏色':'雙格線 '+sub+' 顏色';$('#hint').textContent=m==='cell'?'點格子上色':m==='line'?'點某段格線改成單線並上色':'點某段格線變成雙線；目前編輯線 '+sub;['cell','line','double'].forEach(x=>$('#'+x+'Mode').classList.toggle('active',m===x));draw()}
$('#cellMode').onclick=()=>setMode('cell');$('#lineMode').onclick=()=>setMode('line');$('#doubleMode').onclick=()=>setMode('double');function setSub(s){sub=s;$('#lineA').classList.toggle('active',s==='A');$('#lineB').classList.toggle('active',s==='B');setMode('double')}$('#lineA').onclick=()=>setSub('A');$('#lineB').onclick=()=>setSub('B');
$('#undo').onclick=()=>{let x=history.pop();if(x)restore(x)};$('#clear').onclick=()=>{push();cells=Array(R*C).fill('#ffffff');v=mkLines((C+1)*R);h=mkLines((R+1)*C);draw()};
function loadBrowse(){if(browse<0||!saved.length)return;push();restore(saved[browse]);$('#name').value=saved[browse].name;editing=browse;$('#status').textContent='已載入「'+saved[browse].name+'」'}
function browser(auto=false){if(!saved.length){browse=-1;editing=-1;$('#savedTitle').textContent='尚未儲存作品';$('#counter').textContent='0 / 0';return}if(browse<0)browse=0;if(browse>=saved.length)browse=saved.length-1;$('#savedTitle').textContent=saved[browse].name;$('#counter').textContent=(browse+1)+' / '+saved.length;if(auto)loadBrowse()}
$('#save').onclick=()=>{let name=$('#name').value.trim()||'未命名作品',data={name,...clone()};if(editing>=0&&editing<saved.length){saved[editing]=data;browse=editing;$('#status').textContent='已更新「'+name+'」'}else{saved.push(data);browse=saved.length-1;editing=browse;$('#status').textContent='已永久儲存「'+name+'」'}persist();browser()};
$('#prev').onclick=()=>{if(saved.length){browse=(browse-1+saved.length)%saved.length;browser(true)}};$('#next').onclick=()=>{if(saved.length){browse=(browse+1)%saved.length;browser(true)}};$('#load').onclick=()=>loadBrowse();
$('#deleteDesign').onclick=()=>{if(browse>=0){saved.splice(browse,1);persist();if(browse>=saved.length)browse=saved.length-1;editing=-1;browser(saved.length>0);$('#status').textContent='已刪除作品'}};
function newDesign(){R=Math.max(2,Math.min(50,+$('#rows').value||11));C=Math.max(2,Math.min(50,+$('#cols').value||11));$('#rows').value=R;$('#cols').value=C;push();blank(true);editing=-1;$('#name').value='我的祖母格';draw();$('#status').textContent=`已建立 ${R} × ${C} 新作品`}
$('#newDesign').onclick=newDesign;$('#applySize').onclick=newDesign;
$('#backupAll').onclick=()=>{try{const data={app:'crochet-app',version:1,createdAt:new Date().toISOString(),saved};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');const d=new Date(),pad=n=>String(n).padStart(2,'0');a.href=url;a.download=`crochet-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#status').textContent=`已建立備份：${saved.length} 個作品`;}catch(e){$('#status').textContent='備份失敗，請再試一次';}};
$('#restoreAll').onclick=()=>$('#restoreFile').click();
$('#restoreFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.saved;if(!Array.isArray(incoming))throw new Error('bad backup');const normalized=incoming.map(x=>({...x,rows:x.rows||11,cols:x.cols||11}));if(saved.length&&!confirm(`目前有 ${saved.length} 個作品。\n\n按「確定」：保留目前作品，並加入備份中的 ${normalized.length} 個作品。\n按「取消」：不還原。`)){e.target.value='';return;}saved=[...saved,...normalized];persist();browse=saved.length?Math.max(0,saved.length-normalized.length):-1;editing=-1;browser(saved.length>0);$('#status').textContent=`已還原 ${normalized.length} 個作品；目前共 ${saved.length} 個作品`;}catch(err){$('#status').textContent='這個檔案不是有效的祖母格備份';}e.target.value='';};
// Upgrade old 11x11 saves so they remain loadable.
saved=saved.map(x=>({...x,rows:x.rows||11,cols:x.cols||11}));persist();blank(true);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});draw();browser()})();
</script></body></html>
